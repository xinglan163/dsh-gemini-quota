# 可信发布（Trusted Publishing / OIDC）：推 tag 即发布，不需要任何 NPM_TOKEN。
#
# 前置：在 npmjs.com 的包设置里登记本工作流（见 PUBLISH.md 第 6 节），
# 否则 npm 会拒绝（缺少可信发布者绑定）。
name: publish

# 目前只保留手动触发：本账号被 GitHub 账单锁挡住，Actions 任务无法启动，
# 若留着 push.tags 触发，每次推 tag 都会产生一个失败记录（红叉）。
# 账单恢复后把下面 restore 注释里的三行填回 on: 之下即可恢复"推 tag 自动发布"。
on:
  workflow_dispatch:
  # restore（账单恢复后取消注释）:
  # push:
  #   tags:
  #     - "v*"        # v0.1.1 / v1.0.0 …

permissions:
  contents: read
  id-token: write    # OIDC 换取 npm 发布凭证 + 生成 provenance 签名，必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 刻意不设 registry-url：setup-node 会写一个空 _authToken 的 .npmrc，
      # 让 npm 先尝试 token 认证并 ENEEDAUTH，**阻断 OIDC 可信发布**。
      # npm 默认 registry 本来就是 registry.npmjs.org，无需指定。
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 环境自检（OIDC / npm 版本）
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "registry: $(npm config get registry)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC: 可用"
          else
            echo "::error::OIDC 不可用——检查 workflow 的 permissions.id-token: write"
            exit 1
          fi

      - name: 清理残留的 token 配置（确保走 OIDC 而非 token）
        run: |
          npm config delete //registry.npmjs.org/:_authToken || true
          if grep -q '_authToken' ~/.npmrc 2>/dev/null; then
            echo "::warning::~/.npmrc 里仍有 _authToken，可能干扰可信发布"
          else
            echo "无残留 token 配置"
          fi

      - name: 语法与自测（零依赖，无需安装）
        run: |
          node --check index.js
          node --check client.js
          node selftest.mjs

      - name: 校验 tag 与 package.json 版本一致
        run: |
          # 手动 workflow_dispatch 时 GITHUB_REF_NAME 是分支名，校验 tag 会误报，这里跳过
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "非 tag 触发（${GITHUB_REF_TYPE:-unknown}:${GITHUB_REF_NAME:-unknown}），跳过版本一致性校验"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ($tag) 与 package.json version ($pkg) 不一致"
            exit 1
          fi
          echo "版本一致：$pkg"

      - name: 发布（provenance 由 OIDC 自动生成）
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) tag=alpha ;;   # 预发布版本发到 alpha dist-tag，不污染 latest
            *)   tag=latest ;;
          esac
          echo "publishing $version (dist-tag: $tag)"
          npm publish --provenance --access public --tag "$tag"
